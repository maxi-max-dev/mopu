name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: node --check src/phone_harness/web/app.js
      - run: node --check src/phone_harness/web/actions.js
      - run: node --test tests/actions.test.cjs
      - run: node --test integrations/openclaw/bridge.test.mjs
      - run: python -m pip wheel --no-deps . -w dist
