[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mopu"
version = "0.14.0"
description = "A local Android task console with exclusive human/agent control"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.2"]
license = "MIT"

[project.scripts]
mopu = "mopu.cli:main"
phone-harness = "mopu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mopu = ["web/*", "Desktop.swift"]
