[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-harness"
version = "0.8.0"
description = "A local Android task console with exclusive human/agent control"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.2"]
license = "MIT"

[project.scripts]
phone-harness = "phone_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phone_harness = ["web/*", "Desktop.swift"]
